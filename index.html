<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>말문 쉐도잉</title>
<meta name="theme-color" content="#0B6E69">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="말문">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 한 줄 상단 탭 + 단일 컬럼 작업 화면. 녹음 버튼만 붉은 신호색, 나머지는 청록 잉크. */
:root {
  --bg: #EEF2F1;
  --surface: #FFFFFF;
  --surface-2: #E3E9E7;
  --ink: #10201E;
  --muted: #56676A;
  --line: #D3DCDA;
  --primary: #0B6E69;
  --primary-ink: #FFFFFF;
  --primary-soft: #D5EBE8;
  --rec: #D23F2B;
  --rec-soft: #FBE2DD;
  --star: #B57A06;
  --good: #1E7A3C;
  --good-soft: #DCF0E2;
  --mid: #9A6300;
  --mid-soft: #FBEBC9;
  --bad: #B3261E;
  --bad-soft: #FADCD9;
  --heat-0: #E3E9E7; --heat-1: #B4DCD6; --heat-2: #6FB8AE; --heat-3: #2E8F86; --heat-4: #0B5E59;
  --shadow: 0 1px 2px rgba(16,32,30,.06), 0 6px 20px rgba(16,32,30,.06);
  --f-display: "Bricolage Grotesque", "IBM Plex Sans KR", system-ui, sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-script: "Atkinson Hyperlegible", "IBM Plex Sans KR", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1514; --surface: #162120; --surface-2: #1F2C2A; --ink: #E4EDEB; --muted: #93A5A3; --line: #2A3937;
  --primary: #3FBDB3; --primary-ink: #04201E; --primary-soft: #183C39; --rec: #FF6B57; --rec-soft: #3E1E19;
  --star: #F2B53D; --good: #5CCB82; --good-soft: #173323; --mid: #EBB34A; --mid-soft: #3A2E12; --bad: #FF8A80; --bad-soft: #3D1C1A;
  --heat-0: #1F2C2A; --heat-1: #1E4A45; --heat-2: #24706A; --heat-3: #33A096; --heat-4: #6FD6CB;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E1514; --surface: #162120; --surface-2: #1F2C2A; --ink: #E4EDEB; --muted: #93A5A3; --line: #2A3937;
  --primary: #3FBDB3; --primary-ink: #04201E; --primary-soft: #183C39; --rec: #FF6B57; --rec-soft: #3E1E19;
  --star: #F2B53D; --good: #5CCB82; --good-soft: #173323; --mid: #EBB34A; --mid-soft: #3A2E12; --bad: #FF8A80; --bad-soft: #3D1C1A;
  --heat-0: #1F2C2A; --heat-1: #1E4A45; --heat-2: #24706A; --heat-3: #33A096; --heat-4: #6FD6CB;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--f-body); -webkit-font-smoothing: antialiased; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.25; }
a { color: var(--primary); }

.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* 상단 바 */
.top { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 16px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 8px; margin-right: auto; }
.brand b { font: 700 22px/1 var(--f-display); letter-spacing: -.01em; }
.brand span { font: 500 12px/1 var(--f-mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 999px; }
.tabs button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font-weight: 500; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.iconbtn { border: 1px solid var(--line); background: var(--surface); width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; }
.iconbtn svg { width: 18px; height: 18px; }

main { padding-block: 20px 80px; }
.banner { background: var(--mid-soft); color: var(--ink); border: 1px solid var(--line); padding: 10px 14px; border-radius: 12px; margin-bottom: 16px; font-size: 14px; }

/* 공통 */
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 10px; font-weight: 500; white-space: nowrap; }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn.primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.btn.rec { background: var(--rec); color: #fff; border-color: var(--rec); }
.btn.rec.on { animation: pulse 1.2s ease-in-out infinite; }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: .5; cursor: default; }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px var(--rec-soft); } }
@media (prefers-reduced-motion: reduce) { .btn.rec.on { animation: none; } }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font: 500 12px/1.2 var(--f-body); letter-spacing: .02em; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 10px; font-size: 13px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--primary-soft); color: var(--ink); font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-weight: 500; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.mid { background: var(--mid-soft); color: var(--mid); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
select, input[type=text], textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; max-width: 100%; }
textarea { width: 100%; resize: vertical; }
label.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }

/* 연습 목록 */
.today { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 24px; }
.today .panel { padding: 14px 16px; }
.today .num { font: 700 26px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.today .next { grid-column: span 1; }
.today .next button { margin-top: 6px; }
.level { margin-bottom: 26px; }
.level-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; }
.level-head h2 { font: 700 28px/1 var(--f-display); letter-spacing: -.02em; }
.level-head .bar { flex: 1; height: 4px; background: var(--surface-2); border-radius: 4px; overflow: hidden; align-self: center; }
.level-head .bar i { display: block; height: 100%; background: var(--primary); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.card { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; transition: border-color .15s, transform .15s; }
.card:hover { border-color: var(--primary); }
.card h3 { font: 700 17px/1.25 var(--f-script); }
.card .ko { font-size: 13px; color: var(--muted); }
.steps { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }
.step-dot { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--surface-2); color: var(--muted); }
.step-dot.done { background: var(--good-soft); color: var(--good); }
.step-dot.part { background: var(--mid-soft); color: var(--mid); }
.card.mastered { border-color: var(--good); }
.card.add { border-style: dashed; align-items: flex-start; justify-content: center; color: var(--muted); }

/* 연습 화면 */
.phead { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 14px; }
.phead h1 { font: 700 28px/1.15 var(--f-display); letter-spacing: -.02em; }
.stepbar { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 16px; }
.stepbar button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.stepbar button b { display: block; font-size: 14px; }
.stepbar button span { font-size: 12px; color: var(--muted); }
.stepbar button[aria-selected="true"] { border-color: var(--primary); background: var(--primary-soft); }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.toolbar .grow { margin-left: auto; }

.lines { display: flex; flex-direction: column; gap: 2px; }
.line { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 8px; padding: 10px 10px; border-radius: 10px; }
.line.now { background: var(--primary-soft); }
.line .play { border: 0; background: transparent; color: var(--muted); padding: 2px; height: 28px; border-radius: 8px; }
.line .play:hover { color: var(--primary); background: var(--surface-2); }
.line .play svg { width: 18px; height: 18px; }
.en { font: 400 19px/1.55 var(--f-script); }
.kotr { font-size: 14px; color: var(--muted); margin-top: 2px; }
.blind .en { filter: blur(6px); }
.blind .line.now .en { filter: none; }
.w { cursor: pointer; border-radius: 4px; }
.w:hover { background: var(--surface-2); text-decoration: underline dotted; }
.w.starred { text-decoration: underline; text-decoration-color: var(--star); text-decoration-thickness: 2px; text-underline-offset: 4px; }
.w.ok { color: var(--good); }
.w.near { background: var(--mid-soft); color: var(--mid); }
.w.miss { background: var(--bad-soft); color: var(--bad); text-decoration: underline wavy var(--bad); text-underline-offset: 4px; }
.w.part { background: var(--mid-soft); }

.phrases { margin-top: 22px; }
.phrases .row { margin-top: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
.chip b { font-family: var(--f-script); font-weight: 700; }

/* 문장별 */
.drill { display: grid; gap: 14px; }
.drill .big { padding: 22px; }
.drill .big .en { font-size: 24px; line-height: 1.5; }
.drill .ctrl { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.drill .ctrl .btn.rec { padding: 12px 22px; font-size: 16px; }
.live { min-height: 26px; font: 400 16px/1.5 var(--f-script); color: var(--muted); margin-top: 12px; }
.result { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); }
.score { font: 700 40px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.score.good { color: var(--good); } .score.mid { color: var(--mid); } .score.bad { color: var(--bad); }
.dots { display: flex; flex-wrap: wrap; gap: 4px; }
.dots button { width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); font: 500 11px/1 var(--f-mono); color: var(--muted); padding: 0; }
.dots button.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.dots button.mid { background: var(--mid-soft); color: var(--mid); border-color: transparent; }
.dots button.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.dots button.cur { outline: 2px solid var(--primary); outline-offset: 1px; }

/* 암기 */
.memtext { display: flex; flex-direction: column; gap: 10px; }
.memtext .en { font-size: 18px; }
.hintline { font: 400 18px/1.6 var(--f-mono); letter-spacing: .02em; color: var(--muted); }
.hidden-block { padding: 26px; text-align: center; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); }
.timer { font: 500 34px/1 var(--f-mono); font-variant-numeric: tabular-nums; }
.sentlist { display: grid; gap: 6px; margin-top: 12px; }
.sentlist .item { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 10px; align-items: start; padding: 8px 0; border-bottom: 1px solid var(--line); }

/* 단어장 */
.wlist { display: grid; gap: 10px; }
.witem { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.witem .word { font: 700 20px/1.2 var(--f-script); }
.witem .mean { font-size: 14px; }
.witem .ex { font: 400 14px/1.5 var(--f-script); color: var(--muted); grid-column: 1 / -1; }
.witem .note { grid-column: 1 / -1; width: 100%; font-size: 13px; }
.witem.learned { opacity: .65; }
.quiz { padding: 24px; display: grid; gap: 14px; }
.quiz .q { font-size: 22px; font-weight: 600; }
.quiz .ex { font: 400 18px/1.5 var(--f-script); }

/* 기록 */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
.stats .panel { padding: 14px 16px; }
.stats .num { font: 700 28px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.heat-wrap { overflow-x: auto; }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 14px); gap: 3px; width: max-content; }
.heat i { width: 14px; height: 14px; border-radius: 3px; background: var(--heat-0); display: block; }
.heat i[data-l="1"] { background: var(--heat-1); } .heat i[data-l="2"] { background: var(--heat-2); }
.heat i[data-l="3"] { background: var(--heat-3); } .heat i[data-l="4"] { background: var(--heat-4); }
.heat i.today { outline: 1.5px solid var(--ink); outline-offset: 1px; }
.legend { display: flex; gap: 3px; align-items: center; font-size: 12px; color: var(--muted); }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.ladder { display: grid; gap: 8px; }
.ladder .lrow { display: grid; grid-template-columns: 56px minmax(0, 1fr) 70px; gap: 12px; align-items: center; }
.ladder .track { height: 10px; background: var(--surface-2); border-radius: 6px; overflow: hidden; display: flex; gap: 2px; }
.ladder .track i { height: 100%; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font: 500 11px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
td.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.section { margin-top: 22px; display: grid; gap: 10px; }
.section > h2 { font: 700 20px/1.2 var(--f-display); }

/* 단어 시트 */
.sheet { position: fixed; inset: 0; z-index: 50; background: rgba(5,15,14,.45); display: flex; align-items: flex-end; justify-content: center; padding: 16px; padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); }
@media (min-width: 700px) { .sheet { align-items: center; } }
.sheet-card { width: 100%; max-width: 520px; max-height: 86vh; overflow: auto; background: var(--surface); border-radius: 18px; padding: 20px; box-shadow: var(--shadow); border: 1px solid var(--line); }
.sheet-card .word { font: 700 30px/1.1 var(--f-script); }
.sheet-card .ipa { font-family: var(--f-mono); color: var(--muted); font-size: 14px; }
.sheet-card .komean { font-size: 18px; font-weight: 600; margin-top: 10px; }
.defs { margin: 8px 0 0; padding-left: 18px; font-size: 14px; }
.defs li { margin-bottom: 6px; }
.defs .pos { font: 500 11px/1 var(--f-mono); color: var(--muted); text-transform: uppercase; margin-right: 4px; }
.ctx { margin-top: 14px; padding: 12px; background: var(--surface-2); border-radius: 12px; font: 400 15px/1.5 var(--f-script); }
.starbtn.on { color: var(--star); border-color: var(--star); }
.starbtn.on svg { fill: var(--star); }

.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-size: 14px; z-index: 60; }
.settings { display: grid; gap: 12px; }

@media (max-width: 640px) {
  .today, .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .today .next { grid-column: 1 / -1; }
  .stepbar button span { display: none; }
  .en { font-size: 17px; }
  .drill .big .en { font-size: 20px; }
  .brand span { display: none; }
  .top .wrap { flex-wrap: nowrap; gap: 10px; }
  .tabs button { padding: 6px 10px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><b>말문</b><span>shadow · speak · score</span></div>
    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-practice" data-tab="practice" aria-selected="true">연습</button>
      <button role="tab" id="tab-words" data-tab="words" aria-selected="false">단어장 <span id="wcount" class="mono small"></span></button>
      <button role="tab" id="tab-records" data-tab="records" aria-selected="false">기록</button>
    </nav>
    <button class="iconbtn" id="btn-settings" title="음성 설정" aria-label="음성 설정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></button>
  </div>
</header>
<main class="wrap" id="app"></main>

<div class="sheet" id="sheet" hidden><div class="sheet-card" id="sheet-card" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="content.js"></script>
<script>
'use strict';
/* ───────── 아이콘 ───────── */
const I = {
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l12-7z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
  mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>',
  slow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>',
  next: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>',
  prev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>',
};

/* ───────── 저장소 ───────── */
const KEY = 'malmun.v1';
const DEFAULT = { progress: {}, words: {}, log: [], custom: [], settings: { voice: '', rate: 0.95, showKo: true, repeat: 1, gap: 1, hint: 'none', recordVoice: true } };
function loadState() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) return { ...DEFAULT, ...s, settings: { ...DEFAULT.settings, ...(s.settings || {}) } }; } catch (e) {}
  return structuredClone(DEFAULT);
}
const S = loadState();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

const LEVELS = [

function normTokens(text) {
  const t = String(text).toLowerCase().replace(/[’‘`´]/g, "'").replace(/%/g, ' percent ')
    .replace(/(\d),(\d)/g, '$1$2').replace(/(\d+):(\d+)/g, (m, h, mm) => h + ' ' + (mm === '00' ? '' : mm))
    .replace(/[^a-z0-9'\s]/g, ' ');
  const out = [];
  for (let w of t.split(/\s+/)) {
    w = w.replace(/^'+|'+$/g, '');
    if (!w) continue;
    if (/^\d+$/.test(w)) { out.push(...numWords(parseInt(w, 10)).split(' ')); continue; }
    if (CONTR[w]) { out.push(...CONTR[w].split(' ')); continue; }
    out.push(w.replace(/'/g, ''));

}

// LCS 정렬: ref 각 토큰이 맞았는지(2=정확, 1=비슷, 0=빠짐)와 추가로 말한 단어 수

  const dp = new Uint16Array((n + 1) * (m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) {
    dp[i * W + j] = eq(ref[i], hyp[j]) ? dp[(i + 1) * W + j + 1] + 1 : Math.max(dp[(i + 1) * W + j], dp[i * W + j + 1]);
  }
  const res = new Array(n).fill(0); let i = 0, j = 0, extra = 0;
  while (i < n && j < m) {
    const e = eq(ref[i], hyp[j]);
    if (e && dp[i * W + j] === dp[(i + 1) * W + j + 1] + 1) { res[i] = e; i++; j++; }
    else if (dp[(i + 1) * W + j] >= dp[i * W + j + 1]) i++;

  }

}

function grade(lines, spoken) {
  const flat = [], owners = [];
  const disp = lines.map((ln, s) => ln.split(/\s+/).map((raw, wi) => {
    const toks = normTokens(raw);
    toks.forEach(t => { flat.push(t); owners.push([s, wi]); });
    return { raw, n: toks.length, got: [] };
  }));
  const { res, extra } = align(flat, normTokens(spoken));
  res.forEach((v, k) => { const [s, wi] = owners[k]; disp[s][wi].got.push(v); });
  const sentScores = disp.map(ws => {
    let tot = 0, pts = 0;
    ws.forEach(w => { w.got.forEach(g => { tot++; pts += g === 2 ? 1 : g === 1 ? .7 : 0; }); });
    return tot ? Math.round(pts / tot * 100) : 100;
  });
  let pts = 0; res.forEach(g => pts += g === 2 ? 1 : g === 1 ? .7 : 0);
  const score = flat.length ? Math.round(pts / flat.length * 100) : 0;
  disp.forEach(ws => ws.forEach(w => {
    w.cls = !w.n ? '' : w.got.every(g => g === 2) ? 'ok' : w.got.every(g => g === 0) ? 'miss' : w.got.some(g => g === 0) ? 'part' : 'near';

function baseForm(w) {
  const lw = w.toLowerCase().replace(/'s$/, '');

  if (/ied$/.test(lw)) c.push(lw.slice(0, -3) + 'y');
  if (/ing$/.test(lw)) { const b = lw.slice(0, -3); c.push(b, b + 'e', b.slice(0, -1)); }

  pick() {

// 채점하는 동안 내 목소리를 같이 녹음해 두었다가 다시 들려준다
const Recorder = {
  ok: !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder),
  stream: null, mr: null, chunks: [],
  async start() {
    if (!this.ok || !S.settings.recordVoice) return false;
    try {
      this.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
      this.chunks = [];
      this.mr = new MediaRecorder(this.stream);
      this.mr.ondataavailable = e => { if (e.data && e.data.size) this.chunks.push(e.data); };
      this.mr.start();
      return true;
    } catch (e) { this.cleanup(); return false; }
  },
  stop() {
    return new Promise(res => {
      const mr = this.mr;
      if (!mr || mr.state === 'inactive') { this.cleanup(); return res(null); }
      mr.onstop = () => { const b = new Blob(this.chunks, { type: mr.mimeType || 'audio/webm' }); this.cleanup(); res(b.size ? b : null); };
      try { mr.stop(); } catch (e) { this.cleanup(); res(null); }
    });
  },
  cleanup() { if (this.stream) this.stream.getTracks().forEach(t => t.stop()); this.stream = null; this.mr = null; }
};

function blankOut(ex, word) {
  const clean = word.replace(/-ing\b|~|\.\.\.|\?/g, ' ').trim();
  let re;
  if (/\s/.test(clean)) re = new RegExp(clean.split(/\s+/).filter(p => p.length > 1).map(p => p.replace(/[^a-z'-]/gi, '')).join('[a-z\'-]*\\s+(?:\\S+\\s+)?') + '[a-z\'-]*', 'i');
  else re = new RegExp('\\b' + clean.slice(0, Math.max(3, clean.length - 2)).replace(/[^a-z'-]/gi, '') + '[a-z\'-]*', 'i');
  return esc(ex.replace(re, '\u0000')).replace('\u0000', '_____');
}

  if (t.closest('#add-script')) return addScript();
  if (t.closest('#del-script')) { $('#del-confirm').innerHTML = `<span class="small">정말 삭제할까요? 기록도 함께 지워져요.</span> <button class="btn small rec" id="del-yes">삭제</button>`; return; }
  if (t.closest('#del-yes')) { S.custom = S.custom.filter(s => s.id !== V.script); delete S.progress[V.script]; save(); V.script = null; return render(); }
  // 단어장
  const say = t.closest('[data-say]'); if (say) return TTS.speak(S.words[say.dataset.say].word, 0.85);
  const learn = t.closest('[data-learn]'); if (learn) { const x = S.words[learn.dataset.learn]; x.learned = !x.learned; save(); return render(); }
  const del = t.closest('[data-del]'); if (del) { delete S.words[del.dataset.del]; save(); toast('삭제했어요'); return render(); }
  if (t.closest('#quiz-start')) { const keys = Object.keys(S.words).filter(k => !S.words[k].learned).sort(() => Math.random() - .5); V.quiz = { keys, i: 0, right: 0, msg: '' }; return render(); }
  if (t.closest('#quiz-end')) { if (Listener.busy) Listener.stop(); V.quiz = null; return render(); }
  if (t.closest('#quiz-say')) return quizSay();
  if (t.closest('#quiz-reveal')) { const w = S.words[V.quiz.keys[V.quiz.i]]; V.quiz.msg = `정답: <b style="font-family:var(--f-script)">${esc(w.word)}</b>`; TTS.speak(w.word, 0.85); return render(); }
  if (t.closest('#quiz-next')) { if (Listener.busy) Listener.stop(); V.quiz.i++; V.quiz.msg = ''; if (V.quiz.i >= V.quiz.keys.length) { toast(`퀴즈 끝! ${V.quiz.right}/${V.quiz.keys.length} 맞힘`); V.quiz = null; } return render(); }
  // 설정
  if (t.closest('#voice-test')) {
    $('#mic-live').textContent = '재생 중…';
    await TTS.say("Hi there! This is the voice you'll practice with.", S.settings.rate);
    $('#mic-live').innerHTML = TTS.last.ok ? '소리가 들렸다면 정상이에요. 안 들렸다면 미디어 볼륨을 확인해 주세요.' : `${TTS_HELP} <span class="muted">(오류 코드: ${esc(TTS.last.err)} · 영어 목소리 ${TTS.voices.length}개)</span>`;
    return;
  }
  if (t.closest('#mic-test')) {
    if (Listener.busy) return Listener.stop();
    $('#mic-live').textContent = '듣고 있어요… 영어로 아무 말이나 해 보세요.';
    const r = await Listener.start({ onUpdate: x => $('#mic-live').textContent = x, silenceMs: 1500, maxMs: 10000, noSpeechMs: 7000 });
    $('#mic-live').textContent = r.text ? '들린 말: ' + r.text : (ERR_MSG[r.err] || '아무 말도 들리지 않았어요.');
    return;
  }
  // 백업
  if (t.closest('#export')) {
    const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `말문-백업-${dayKey(Date.now())}.json`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000); return;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'show-ko') { S.settings.showKo = t.checked; save(); if (!settingsOpen) render(); }
  if (t.id === 'blind') { V.blind = t.checked; $('#lines')?.classList.toggle('blind', t.checked); }
  if (t.id === 'rec-voice') { S.settings.recordVoice = t.checked; save(); }
  if (t.id === 'auto') { drillState.auto = t.checked; if (t.checked && !Listener.busy) drillAuto(); }
  if (t.id === 'voice') { S.settings.voice = t.value; save(); }
  if (t.dataset.note) { S.words[t.dataset.note].note = t.value; save(); }
  if (t.id === 'import-file' && t.files[0]) {
    const fr = new FileReader();
    fr.onload = () => {
      try { const d = JSON.parse(fr.result); if (!d.progress || !d.log) throw 0; Object.assign(S, d); save(); render(); toast('백업을 불러왔어요'); }
      catch (err) { toast('말문 백업 파일이 아니에요'); }
    };
    fr.readAsText(t.files[0]);
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) { settingsOpen = false; closeSheet(); } });

TTS.init();
render();
</script>
</body>
